---
# Dependabot config for rovisoft-web.
#
# Two ecosystems:
# * github-actions: the actions in .github/workflows/*.yml, all pinned by
#   commit SHA with the version in a comment. Dependabot moves the SHA and
#   the comment together.
# * npm: the development tools only (Playwright, wrangler, Prettier). The
#   site itself has no dependencies.
#
# Not covered, bumped by hand:
# * actionlint: the `ver=` and `sha=` lines in .github/workflows/ci.yml.
# * Node.js: .nvmrc.
#
# Nothing here auto-merges; the maintainer reviews and merges every PR.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["actions/*"]
      third-party:
        patterns: ["*"]
        exclude-patterns: ["actions/*"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev-tools:
        patterns: ["*"]
