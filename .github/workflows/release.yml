name: Release

# Six-job pipeline: validate-tag-input → (verify-tag-reachability
# ∥ verify-tag-signature) → build → publish → verify-production.
# Follows the release workflow of airvzxf/ftp-deployment-action (and
# moagan), adapted to a static site: there is no image or package to
# publish. Cloudflare Pages already deploys every push to main, so a
# release records a version: a GitHub Release with the CHANGELOG notes,
# the source archive of the site, its SHA-256 checksum and a signed build
# provenance attestation.
#
# Release process (see CONTRIBUTING.md):
#   1. Bump VERSION, the main.js constant, the ?v= in index.html,
#      package.json and README, and add the CHANGELOG section, in a PR.
#      scripts/check-version.py (CI) fails if any copy disagrees.
#   2. Merge the PR into main (Cloudflare Pages deploys it).
#   3. Sign and push the tag on the merge commit:
#        git tag -s vX.Y.Z -m 'release: X.Y.Z' "$(git rev-parse origin/main)"
#        git push origin vX.Y.Z
#
# Triggers
# --------
# * `push` on tags matching `v[0-9]+.[0-9]+.[0-9]+*` (the `*` allows
#   pre-releases such as v1.15.0-rc.1).
# * `workflow_dispatch` with the tag as `version`, to re-run a release
#   for an existing tag. validate-tag-input checks the input shape.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to release (e.g. v1.14.0). Must exist on the remote."
        required: true
        type: string

# A single release per tag: two runs for the same tag would race the
# publish step.
concurrency:
  group: release-${{ github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

# No top-level `permissions:` — each job declares its own, following the
# principle of least privilege.

# The awk program that prints the CHANGELOG.md section for version `v`
# (passed with `awk -v v=X.Y.Z`). Defined once so verify-tag-reachability
# and build cannot disagree on what the section is. It ignores the
# `## [Unreleased]` block and stops at the next `## [...]` heading or the
# compare-link footer.
env:
  CHANGELOG_SECTION_AWK: |
    BEGIN {
        in_section = 0
        v_escaped = v
        gsub(/\./, "\\.", v_escaped)
        heading_re = "^## \\[" v_escaped "\\]( -.*)?$"
        next_heading_re = "^## \\["
        compare_re = "^\\[[^]]+\\]: "
    }
    $0 ~ heading_re { in_section = 1; next }
    in_section && $0 ~ next_heading_re { exit }
    in_section && $0 ~ compare_re { exit }
    in_section { print }

jobs:
  # Job 1: fails fast on a malformed tag, before any checkout. The push
  # filter already restricts the shape; this guards the workflow_dispatch
  # input, which later steps pass to git.
  validate-tag-input:
    name: "Validate · tag input"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.TAG }}
    steps:
      - name: Validate tag shape
        id: resolve
        env:
          RAW: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          TAG="${RAW}"
          # grep anchors per line, so reject line breaks and other
          # non-printable characters first; the anchored regex then
          # rejects every shell metacharacter.
          case "${TAG}" in
            *[![:print:]]*)
              echo "ERROR: tag input contains a non-printable character (e.g. a line break)"
              exit 1
              ;;
          esac
          if ! printf '%s' "${TAG}" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "ERROR: '${TAG}' is not vX.Y.Z (optionally -suffix)"
            exit 1
          fi
          echo "TAG=${TAG}" >> "$GITHUB_OUTPUT"

  # Job 2: the tag must point at a commit of main (the merge commit, not a
  # branch tip that a squash merge discarded), and that commit must carry
  # the matching version and CHANGELOG section. Runs in parallel with
  # verify-tag-signature.
  verify-tag-reachability:
    name: "Verify · tag is reachable from main"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    needs: validate-tag-input
    outputs:
      tag_commit: ${{ steps.resolve.outputs.TAG_COMMIT }}
    steps:
      - name: Checkout at ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.validate-tag-input.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve tag commit + fetch main
        id: resolve
        env:
          TAG: ${{ needs.validate-tag-input.outputs.tag }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          TAG_COMMIT="$(git rev-parse "${TAG}^{commit}")"
          MAIN_COMMIT="$(git rev-parse origin/main)"
          echo "tag=${TAG} tag_commit=${TAG_COMMIT} main_head=${MAIN_COMMIT}"
          {
            echo "TAG=${TAG}"
            echo "TAG_COMMIT=${TAG_COMMIT}"
            echo "MAIN_COMMIT=${MAIN_COMMIT}"
          } >> "$GITHUB_OUTPUT"

      # The checkout is the tag commit, so this checks the released files:
      # VERSION equals the tag's core version (v1.14.0 and v1.14.0-rc.1
      # both need 1.14.0) and every other copy of the version agrees.
      - name: Fail if the version at the tag commit differs from the tag
        env:
          TAG: ${{ steps.resolve.outputs.TAG }}
        run: python3 scripts/check-version.py --tag "${TAG}"

      - name: Fail if CHANGELOG at the tag commit has no section for the version
        env:
          TAG: ${{ steps.resolve.outputs.TAG }}
          TAG_COMMIT: ${{ steps.resolve.outputs.TAG_COMMIT }}
        run: |
          set -euo pipefail
          core="${TAG#v}"
          core="${core%%-*}"
          notes="$(git show "${TAG_COMMIT}:CHANGELOG.md" | awk -v v="${core}" "${CHANGELOG_SECTION_AWK}")"
          if [ -z "${notes//[[:space:]]/}" ]; then
            echo "::error::CHANGELOG.md at ${TAG} (${TAG_COMMIT}) has no '## [${core}]' section, or it is empty. Add the release notes in the release PR and re-tag."
            exit 1
          fi
          echo "✓ CHANGELOG.md has a non-empty [${core}] section for ${TAG}"

      - name: Fail if tag^{commit} is not an ancestor of main
        env:
          TAG: ${{ steps.resolve.outputs.TAG }}
          TAG_COMMIT: ${{ steps.resolve.outputs.TAG_COMMIT }}
          MAIN_COMMIT: ${{ steps.resolve.outputs.MAIN_COMMIT }}
        run: |
          set -euo pipefail
          if git merge-base --is-ancestor "${TAG_COMMIT}" origin/main; then
            echo "✓ ${TAG} (${TAG_COMMIT}) is reachable from origin/main (${MAIN_COMMIT})"
            exit 0
          fi
          {
            echo "ERROR: tag ${TAG} points at ${TAG_COMMIT}, which is NOT an"
            echo "ancestor of origin/main (${MAIN_COMMIT})."
            echo ""
            echo "The tag was created on a branch tip or a local commit that"
            echo "the merge into main did not keep, so the release would not"
            echo "match what Cloudflare Pages deployed."
            echo ""
            echo "Fix (delete the orphan tag, re-tag the merge commit on main):"
            echo "  git tag -d ${TAG}"
            echo "  git push origin :refs/tags/${TAG}"
            echo "  git fetch origin main"
            echo "  git tag -s ${TAG} -m 'release: ${TAG#v}' \$(git rev-parse origin/main)"
            echo "  git push origin ${TAG}"
          } >&2
          exit 1

  # Job 3: the tag must be signed by a key in .github/trusted-signers
  # (SSH) or .github/trusted-signers.asc (PGP). The allow-list is read
  # from origin/main, not from the tagged tree, so removing a key on main
  # revokes it for every later release.
  verify-tag-signature:
    name: "Verify · tag is signed by a trusted signer"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    needs: validate-tag-input
    outputs:
      verified_commit: ${{ steps.verify.outputs.VERIFIED_COMMIT }}
    steps:
      - name: Checkout at ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.validate-tag-input.outputs.tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Fetch allow-list from origin/main
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          mkdir -p "$RUNNER_TEMP/trusted"
          git show "origin/main:.github/trusted-signers" \
            > "$RUNNER_TEMP/trusted/allowed_signers"
          # The PGP allow-list is only needed when the tag is PGP-signed.
          if git show "origin/main:.github/trusted-signers.asc" \
              > "$RUNNER_TEMP/trusted/allowed_signers.asc" 2>/dev/null; then
            echo "PGP allow-list fetched"
          else
            echo "PGP allow-list absent on origin/main (acceptable only if the tag is not PGP-signed)"
            rm -f "$RUNNER_TEMP/trusted/allowed_signers.asc"
          fi
          test -s "$RUNNER_TEMP/trusted/allowed_signers" \
            || { echo "ERROR: empty .github/trusted-signers on origin/main"; exit 1; }

      - name: Configure git to use the trusted signers file
        # git verify-tag uses gpg.ssh.allowedsignersfile for SSH-signed
        # tags and the GPG keyring for PGP-signed tags.
        run: |
          set -euo pipefail
          git config gpg.format ssh
          git config gpg.ssh.allowedsignersfile "$RUNNER_TEMP/trusted/allowed_signers"

      - name: Import GPG allow-list if the tag is PGP-signed
        env:
          TAG: ${{ needs.validate-tag-input.outputs.tag }}
        run: |
          set -euo pipefail
          # Like git, the signature starts at the LAST line that is exactly
          # a BEGIN PGP/SSH SIGNATURE marker, so text in the tag message
          # cannot pick the PGP branch. A lightweight tag takes the else
          # branch; git verify-tag rejects it in the next step.
          SIG=lightweight
          if [ "$(git cat-file -t "refs/tags/$TAG" 2>/dev/null || true)" = tag ]; then
            OBJ="$(git cat-file tag "refs/tags/$TAG")"
            SIG="$(printf '%s\n' "$OBJ" | awk '
              $0 == "-----BEGIN PGP SIGNATURE-----" { fmt = "pgp" }
              $0 == "-----BEGIN SSH SIGNATURE-----" { fmt = "ssh" }
              END { if (fmt == "") fmt = "unsigned"; print fmt }')"
          fi
          if [ "$SIG" = pgp ]; then
            test -f "$RUNNER_TEMP/trusted/allowed_signers.asc" \
              || { echo "ERROR: tag is PGP-signed but .github/trusted-signers.asc is missing on origin/main"; exit 1; }
            gpg --batch --import "$RUNNER_TEMP/trusted/allowed_signers.asc"
          else
            echo "Tag has no PGP signature block — GPG keyring not required"
          fi

      - name: Verify tag signature
        id: verify
        env:
          TAG: ${{ needs.validate-tag-input.outputs.tag }}
        run: |
          set -euo pipefail
          if git verify-tag "refs/tags/${TAG}"; then
            echo "✓ ${TAG} is signed by a key in the trusted-signers allow-list from origin/main"
            # git verify-tag does not check that the signed object's own
            # `tag` header names this ref; without this, an old signed tag
            # object re-pushed as refs/tags/${TAG} would pass.
            TAG_NAME="$(git cat-file tag "refs/tags/${TAG}" | sed -n '1,/^$/s/^tag //p')"
            if [ -z "${TAG_NAME}" ]; then
              echo "::error::refs/tags/${TAG} has no tag header (not a tag object)"
              exit 1
            fi
            if [ "${TAG_NAME}" != "${TAG}" ]; then
              echo "::error::tag object is named '${TAG_NAME}' but was pushed as refs/tags/${TAG}"
              exit 1
            fi
            VERIFIED_COMMIT="$(git rev-parse "refs/tags/${TAG}^{commit}")"
            echo "VERIFIED_COMMIT=${VERIFIED_COMMIT}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "ERROR: tag ${TAG} is NOT signed by a key in"
            echo ".github/trusted-signers (SSH) or .github/trusted-signers.asc (PGP), fetched from origin/main."
            echo ""
            echo "Signer info for diagnosis:"
            git cat-file tag "${TAG}" \
              | grep -E '^(tagger|-----BEGIN|-----END)' \
              | head -10 >&2 || true
            echo ""
            echo "Fix (re-tag with the maintainer's signing key):"
            echo "  git tag -d ${TAG}"
            echo "  git push origin :refs/tags/${TAG}"
            echo "  git tag -s ${TAG} -m 'release: ${TAG#v}' <commit on main>"
            echo "  git push origin ${TAG}"
          } >&2
          exit 1

  # Job 4: builds the release files from the exact commit both verify jobs
  # approved: the source archive of the site, its checksum, a signed SLSA
  # build provenance attestation and the release notes.
  build:
    name: "Build · site archive"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    needs: [validate-tag-input, verify-tag-reachability, verify-tag-signature]
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      # The verify jobs fetch the mutable tag separately. Refuse to build
      # unless the commit whose signature was verified is the commit that
      # reachability approved.
      - name: Fail if the verified tag commit differs from tag_commit
        env:
          VERIFIED_COMMIT: ${{ needs.verify-tag-signature.outputs.verified_commit }}
          TAG_COMMIT: ${{ needs.verify-tag-reachability.outputs.tag_commit }}
        run: |
          set -euo pipefail
          for pair in "verified_commit=${VERIFIED_COMMIT}" "tag_commit=${TAG_COMMIT}"; do
            if ! [[ "${pair#*=}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::${pair%%=*} '${pair#*=}' is not a 40-char lowercase hex SHA"
              exit 1
            fi
          done
          if [ "${VERIFIED_COMMIT}" != "${TAG_COMMIT}" ]; then
            echo "::error::Signed tag points at ${VERIFIED_COMMIT}, but reachability approved ${TAG_COMMIT}; the tag moved between the verify jobs"
            exit 1
          fi
          echo "✓ verified tag commit equals tag_commit (${TAG_COMMIT})"

      # SHA-pinned checkout: a tag force-pushed mid-run cannot redirect the
      # build away from the approved commit.
      - name: Checkout source at the pinned tag SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-tag-reachability.outputs.tag_commit }}
          persist-credentials: false

      - name: Resolve version
        id: meta
        env:
          TAG: ${{ needs.validate-tag-input.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          {
            echo "tag=${TAG}"
            echo "version=${version}"
            echo "archive=rovisoft-web-${version}.tar.gz"
          } >> "$GITHUB_OUTPUT"

      - name: Fail if the released files are inconsistent
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          python3 scripts/check-version.py --tag "${TAG}"
          python3 csp-hashes.py --check

      # git archive is reproducible: the same commit always gives the same
      # tar stream (mtime = commit time), and `gzip -n` drops the name and
      # time stamp, so anyone can rebuild the archive and compare the hash.
      - name: Build the site archive
        env:
          TAG_COMMIT: ${{ needs.verify-tag-reachability.outputs.tag_commit }}
          VERSION: ${{ steps.meta.outputs.version }}
          ARCHIVE: ${{ steps.meta.outputs.archive }}
          TEMP_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          out="${TEMP_DIR}/release-artifacts"
          mkdir -p "${out}"
          git archive --format=tar --prefix="rovisoft-web-${VERSION}/" "${TAG_COMMIT}" \
            src LICENSE README.md CHANGELOG.md VERSION \
            | gzip -n -9 > "${out}/${ARCHIVE}"
          (cd "${out}" && sha256sum "${ARCHIVE}" > SHA256SUMS)
          cat "${out}/SHA256SUMS"
          tar -tzf "${out}/${ARCHIVE}" | head -20

      - name: Attest build provenance of the archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/release-artifacts/${{ steps.meta.outputs.archive }}

      # The release body is the CHANGELOG section, extracted with the same
      # awk program verify-tag-reachability already ran on this commit.
      - name: Extract CHANGELOG notes for this version
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TEMP_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          core="${VERSION%%-*}"
          notes="$(awk -v v="${core}" "${CHANGELOG_SECTION_AWK}" CHANGELOG.md)"
          if [ -z "${notes//[[:space:]]/}" ]; then
            echo "::error::no non-empty CHANGELOG section found for ${core}"
            exit 1
          fi
          printf '%s\n' "${notes}" > "${TEMP_DIR}/release-artifacts/CHANGELOG.body.md"
          echo "wrote $(wc -l < "${TEMP_DIR}/release-artifacts/CHANGELOG.body.md") lines to CHANGELOG.body.md"

      - name: Upload bundle for the publisher job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rovisoft-web-release-bundle
          path: ${{ runner.temp }}/release-artifacts/
          retention-days: 7
          if-no-files-found: error

  # Job 5: creates the GitHub Release page. `contents: write` is scoped to
  # this job.
  publish:
    name: "Publish · GitHub Release"
    needs: [validate-tag-input, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rovisoft-web-release-bundle
          path: release/

      - name: Verify the checksum before publishing
        run: |
          set -euo pipefail
          cd release
          sha256sum -c SHA256SUMS

      - name: Extract metadata
        id: meta
        env:
          TAG: ${{ needs.validate-tag-input.outputs.tag }}
        run: |
          set -euo pipefail
          # Random delimiter: a CHANGELOG line that is exactly `EOF` would
          # end a fixed delimiter early.
          delim="EOF_$(openssl rand -hex 16)"
          {
            echo "tag=${TAG}"
            echo "body<<${delim}"
            cat release/CHANGELOG.body.md
            echo "${delim}"
          } >> "$GITHUB_OUTPUT"

      # Pre-release tags must not become the repository's latest release.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          prerelease: ${{ contains(steps.meta.outputs.tag, '-') }}
          make_latest: ${{ !contains(steps.meta.outputs.tag, '-') }}
          body: ${{ steps.meta.outputs.body }}
          files: |
            release/rovisoft-web-*.tar.gz
            release/SHA256SUMS
          fail_on_unmatched_files: true

  # Job 6: the tag is on main, so Cloudflare Pages has deployed (or is
  # deploying) this version. Fail loudly if production does not serve it:
  # a failed Pages build or a stale cache buster would otherwise go
  # unnoticed. Skipped for pre-releases.
  verify-production:
    name: "Verify · rovisoft.net serves the release"
    needs: [validate-tag-input, build, publish]
    if: ${{ !contains(needs.validate-tag-input.outputs.tag, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Wait for production to serve main.js?v=VERSION
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 20 https://rovisoft.net/ | grep -Fq "main.js?v=${VERSION}"; then
              echo "✓ https://rovisoft.net/ serves version ${VERSION} (attempt ${attempt})"
              exit 0
            fi
            echo "attempt ${attempt}: production does not serve ${VERSION} yet"
            sleep 30
          done
          echo "::error::https://rovisoft.net/ still does not serve version ${VERSION} after 15 minutes. Check the Cloudflare Pages deployment of main."
          exit 1
