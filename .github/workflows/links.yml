name: Links

# Checks the external links of the site (portfolio repositories, AUR,
# social networks). Links break without any change in this repository
# (a renamed repository, a master -> main branch), so the check runs every
# week as well as on pull requests that touch the site.
#
# A broken link fails the run; a redirect only warns, so the site can be
# updated before the redirect disappears.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "scripts/check-links.py"
      - ".github/workflows/links.yml"

permissions:
  contents: read

jobs:
  links:
    name: External links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the links
        run: python3 scripts/check-links.py
