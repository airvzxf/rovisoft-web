      @font-face {

      body {
        margin: 0;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font-family: "Martian Mono", monospace;
        font-size: 15px;
        line-height: 1.6;
      }

      pre {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
        font: inherit;
      }

      .user {
        color: var(--green);
        font-weight: bold;
      }
      .host {
        color: var(--cyan);
        font-weight: bold;
      }
      .path {
        color: var(--yellow);
      }
      .dim {
        color: var(--text-dim);
      }
      .err {
        color: var(--red);
      }
      a {
